# Source overlay for experimental Computer Use. Tool rows load TypeScript
# through the CLI tsx loader. Not part of dsh-base.
# The registry row is top level on purpose: a provide from inside the preset
# lands in the root realm and the preset-mount audit rejects it.

- insert:
    - id: computer-use-code-agent-registry
      name: './src/code-agent-registry.ts'
    - id: preset-computer-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: computer-use
        order: 20
        plugins:
          - id: tool-computer-use
            name: './src/index.ts'
            config:
              postActionWaitMs: 600
          - id: tool-code-agent
            name: './src/code-agent.ts'
