# Source overlay for `pnpm dsh web`. The locator's relative entry is anchored
# to this file and runs through the CLI's tsx loader without a profile install
# or `pnpm run build`. Restart the running dsh web process after adding --patch.
# The overlay adds a system Computer Use agent preset; it does not register
# GUI tools on the Host. The agent-presets row injects computerUsePresetRoot so
# Loader interpolation waits for the locator. This plugin drives the real
# unsandboxed desktop and is not part of dsh-base.

- insert:
    - id: computer-use-preset-root
      name: './src/preset-root.ts'

- id: agent-presets
  inject: [computerUsePresetRoot]
  config:
    default: standard
    roots:
      - path: !!js ctx.computerUsePresetRoot
        trust: system
