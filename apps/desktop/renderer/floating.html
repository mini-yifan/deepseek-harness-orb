<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' dsh-app://app; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="floating.css">
  </head>
  <body>
    <section id="panel" hidden>
      <button id="new-conversation" type="button"></button>
      <div id="transcript" role="log" aria-live="polite"></div>
      <p id="status" role="status"></p>
      <form id="composer">
        <label id="input-label" for="prompt"></label>
        <input id="prompt" type="text" autocomplete="off" required>
      </form>
      <button id="stop" type="button" hidden></button>
    </section>
    <button id="ball" type="button">
      <img id="ball-gif" src="defaultgif.gif" alt="" draggable="false">
    </button>
    <script src="floating.js"></script>
  </body>
</html>
