<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' dsh-app://app; img-src 'self' data:; frame-src dsh-app://app">
    <title id="page-title"></title>
    <link rel="stylesheet" href="floating.css">
  </head>
  <body>
    <section id="panel" hidden>
      <button id="history" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="M8 4.5v4l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div id="permission">
        <button id="permission-button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="permission-label"></span>
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M3 4.5 6 8l3-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <ul id="permission-menu" role="listbox" hidden></ul>
      </div>
      <button id="new-conversation" type="button">+</button>
      <div id="transcript" role="log" aria-live="polite"></div>
      <div id="question" hidden>
        <div class="question-card">
          <header class="question-heading">
            <div class="question-heading-text">
              <p id="question-eyebrow" hidden></p>
              <h2 id="question-title"></h2>
            </div>
            <button id="question-cancel" type="button"></button>
          </header>
          <p id="question-detail" hidden></p>
          <div id="question-options"></div>
          <textarea id="question-custom" rows="1" hidden></textarea>
          <p id="question-error" role="status" hidden></p>
          <footer class="question-footer">
            <div id="question-pager" class="question-pager" hidden>
              <button id="question-prev" type="button"></button>
              <span id="question-progress"></span>
              <button id="question-next-nav" type="button"></button>
            </div>
            <div class="question-actions">
              <button id="question-skip" type="button"></button>
              <button id="question-continue" type="button"></button>
            </div>
          </footer>
        </div>
      </div>
      <div id="history-list" role="listbox" hidden></div>
      <p id="status" role="status"></p>
      <div id="selection-chip" hidden>
        <span id="selection-chip-text"></span>
        <button id="selection-chip-dismiss" type="button"></button>
      </div>
      <form id="composer">
        <label id="input-label"></label>
        <div id="prompt" class="prompt-empty" role="textbox" aria-multiline="true" aria-labelledby="input-label" contenteditable="true"></div>
      </form>
    </section>
    <button id="ball" type="button">
      <img id="ball-gif" src="deepseek-avatar-square.gif" alt="" draggable="false">
    </button>
    <button id="stop" type="button" hidden></button>
    <script src="floating.js"></script>
  </body>
</html>
