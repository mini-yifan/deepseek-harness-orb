# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  inject: []
  config:
    host: 127.0.0.1
    port: 0
    listen: false

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: ui-settings-orb
      name: '@deepseek-ai/dsh-client-ui-settings-orb'

    - id: computer-use-preset-root
      name: '../lib/computer-use-preset-root.js'

    - id: computer-use-overlay-guard
      name: '../lib/computer-use-overlay-guard.js'

    - id: computer-use-orb-permission
      name: '../lib/computer-use-orb-permission.js'

    - id: computer-use-orb-code-agent-model
      name: '../lib/computer-use-orb-code-agent-model.js'

- id: agent-presets
  inject: [computerUsePresetRoot]
  config:
    default: standard
